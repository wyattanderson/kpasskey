name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@083175551ceeceebc757ebee2127fde78840ca77 # 0.18.0
        with:
          bazelisk-version: 1.x
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Run SwiftLint
        run: bazel run --config=lint --lockfile_mode=error @swiftlint_linux//:swiftlint -- lint --strict "$GITHUB_WORKSPACE"
      - name: Check SwiftFormat
        run: bazel run --config=lint --lockfile_mode=error @swiftformat//:swiftformat -- --lint "$GITHUB_WORKSPACE" --reporter github-actions-log
